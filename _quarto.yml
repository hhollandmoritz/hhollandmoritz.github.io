project:
  type: website
  resources:
    - "~/.Rproj.user/**"
  pre-render:
    - python scripts/generate_publications.py
  output-dir: docs
  
website:
  title: ""
  navbar:
    background: primary
    left:
      - text: "About"
        href: index.qmd
      - text: "Research"
        href: projects/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "Blog"
        href: posts/index.qmd
      - text: "CV"
        href: assets/pdf/CV.pdf

    right:
      - icon: github
        href: https://github.com/hhollandmoritz
  page-footer:
    center: "Copyright &copy; 2026, Hannah Holland-Moritz,  Photos not taken by the author or otherwise credited are from [Unsplash](https://unsplash.com)."
    background: secondary


format:
  html:
    theme:
      light: assets/styles/light.scss
      dark: assets/styles/dark.scss
    mainfont: Open Sans
    toc: true
    link-external-newwindow: true
    link-external-icon: false
    code-annotations: hover